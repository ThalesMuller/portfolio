[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"

  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/thales-muller-curriculo.pdf"

  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "attachment; filename=thales-muller-curriculo.pdf"
